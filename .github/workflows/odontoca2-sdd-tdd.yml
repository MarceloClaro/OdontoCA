name: OdontoCA 2.0 SDD-TDD

on:
  push:
    paths:
      - "odontoca2/**"
      - ".github/workflows/odontoca2-sdd-tdd.yml"
  pull_request:
    paths:
      - "odontoca2/**"
      - ".github/workflows/odontoca2-sdd-tdd.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "./odontoca2[test]"
      - name: Run tests
        run: pytest odontoca2/tests -q
